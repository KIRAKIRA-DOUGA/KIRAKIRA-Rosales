name: Check for env theft

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-process-env:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
    # Only read the diff; never check out or execute PR code with a write token.
    - name: Check environment access and notify the PR
      shell: bash
      run: |
        gh pr diff "$PR_NUMBER" --color never > "$RUNNER_TEMP/pr.diff"
        if grep -qE '^\+.*process\.env' "$RUNNER_TEMP/pr.diff"; then
          gh pr comment "$PR_NUMBER" --body 'Potential environment variable theft detected: this PR adds references to `process.env`. Please review whether these changes could expose secrets. This is a heuristic warning, not proof of theft.'
          exit 1
        fi
